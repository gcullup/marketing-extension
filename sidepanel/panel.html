<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>TNG Marketing Extension</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
        width: 320px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 12px;
      }
      #status {
        font-size: 13px;
        color: #333;
        margin-bottom: 12px;
        padding: 8px;
        background: #f0f4f8;
        border-radius: 6px;
      }
      button {
        padding: 6px 10px;
        font-size: 13px;
        cursor: pointer;
      }
      #pingResult,
      #scrapeResult,
      #clickResult,
      #fullScrapeResult,
      #aiScreenResult,
      #ledgerResult,
      #batchResult {
        font-size: 12px;
        color: #555;
        margin-top: 8px;
        word-break: break-word;
        white-space: pre-wrap;
        max-height: 240px;
        overflow-y: auto;
      }
      a {
        font-size: 12px;
      }
      @keyframes mkt-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .spinner {
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid #ccc;
        border-top-color: #1a7a1a;
        border-radius: 50%;
        animation: mkt-spin 0.8s linear infinite;
        vertical-align: middle;
        margin-right: 6px;
      }
      .progress-wrap {
        margin-top: 6px;
        display: none;
      }
      .progress-bar-outer {
        background: #eee;
        border-radius: 4px;
        height: 8px;
        overflow: hidden;
      }
      .progress-bar-inner {
        background: #1a7a1a;
        height: 100%;
        width: 0%;
        transition: width 0.3s ease;
      }
      .progress-text {
        font-size: 11px;
        color: #666;
        margin-top: 3px;
      }
    </style>
  </head>
  <body>
    <h1>TNG Marketing Extension</h1>
    <div id="status">Checking storage…</div>
    <p><a href="review.html" target="_blank" id="reviewQueueLink">Review Queue</a></p>
    <p><a href="send.html" target="_blank" id="sendQueueLink">Send Queue</a></p>
    <button id="pingBtn">Ping content script (open a Facebook tab first)</button>
    <div id="pingResult"></div>
    <p>
      <button id="testScrapeBtn">Test Scrape (read-only — go to facebook.com/friends/suggestions first)</button>
    </p>
    <div id="scrapeResult"></div>
    <p>
      <button id="testClickBtn">Test Click First Candidate (navigates to their real profile — no Add Friend click)</button>
    </p>
    <div id="clickResult"></div>
    <p>
      <button id="testFullScrapeBtn">Test Full Candidate Scrape (click + scroll + extract text — takes a few seconds)</button>
    </p>
    <div id="fullScrapeResult"></div>
    <p>
      <button id="testAiScreenBtn">Test AI Screening (needs a Claude API key in Settings first)</button>
    </p>
    <div id="aiScreenResult"></div>
    <p>
      <button id="viewLedgerBtn">View Ledger</button>
    </p>
    <div id="ledgerResult"></div>
    <p>
      <button id="runBatchBtn">Run Discovery Batch (screens up to today's scan limit — can take several minutes)</button>
      <span class="spinner" id="batchSpinner" style="display: none;"></span>
    </p>
    <div class="progress-wrap" id="batchProgressWrap">
      <div class="progress-bar-outer"><div class="progress-bar-inner" id="batchProgressBar"></div></div>
      <div class="progress-text" id="batchProgressText"></div>
    </div>
    <div id="batchResult"></div>
    <p><a href="settings.html" target="_blank">Settings</a></p>
    <script type="module" src="panel.js"></script>
  </body>
</html>
