<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Review Queue — TNG Marketing Extension</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 16px;
        max-width: 720px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      #count {
        font-size: 13px;
        color: #555;
        margin-bottom: 16px;
      }
      #empty {
        font-size: 14px;
        color: #666;
        padding: 24px;
        text-align: center;
        background: #f7f8fa;
        border-radius: 8px;
        display: none;
      }
      .card {
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 14px 16px;
        margin-bottom: 12px;
        background: #fff;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        margin-bottom: 6px;
      }
      .card-header a {
        font-size: 15px;
        font-weight: 600;
        color: #1a1a1a;
        text-decoration: none;
      }
      .card-header a:hover {
        text-decoration: underline;
      }
      .confidence {
        font-size: 13px;
        font-weight: 600;
        white-space: nowrap;
      }
      .confidence.high {
        color: #1a7a1a;
      }
      .confidence.mid {
        color: #8a5300;
      }
      .meta {
        font-size: 11px;
        color: #888;
        margin-bottom: 8px;
      }
      .reasoning {
        font-size: 13px;
        color: #333;
        margin-bottom: 8px;
        line-height: 1.4;
      }
      .signals {
        margin: 0 0 10px;
        padding-left: 18px;
        font-size: 12px;
        color: #555;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      button {
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #ccc;
      }
      .approveBtn {
        background: #1a7a1a;
        color: white;
        border-color: #1a7a1a;
      }
      .skipBtn {
        background: #fff;
        color: #a33;
        border-color: #d99;
      }
      .card-status {
        font-size: 12px;
        color: #666;
        font-style: italic;
      }
      #refreshBtn {
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <h1>Review Queue</h1>
    <div id="count">Loading…</div>
    <button id="refreshBtn">Refresh</button>
    <button id="resetBtn" style="background: #fff; color: #a33; border-color: #d99;">Reset Queue (delete everyone waiting)</button>
    <div id="empty">Nobody waiting for review right now.</div>
    <div id="cards"></div>
    <script type="module" src="review.js"></script>
  </body>
</html>
