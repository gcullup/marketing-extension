<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Content — TNG Marketing Extension</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 16px;
        max-width: 640px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      #dayInfo {
        font-size: 13px;
        color: #555;
        margin-bottom: 4px;
      }
      #mediaNote {
        font-size: 13px;
        color: #8a5300;
        background: #fff6e5;
        border: 1px solid #f0d999;
        border-radius: 6px;
        padding: 8px 10px;
        margin-bottom: 12px;
        display: none;
      }
      #noPlan {
        font-size: 14px;
        color: #666;
        padding: 24px;
        text-align: center;
        background: #f7f8fa;
        border-radius: 8px;
        display: none;
      }
      textarea {
        width: 100%;
        min-height: 160px;
        font: inherit;
        font-size: 14px;
        padding: 10px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        resize: vertical;
        margin-bottom: 8px;
      }
      #charCount {
        font-size: 12px;
        color: #888;
        margin-bottom: 12px;
      }
      #charCount.over {
        color: #a33;
        font-weight: 600;
      }
      button {
        padding: 6px 14px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid #1a7a1a;
        background: #1a7a1a;
        color: white;
        white-space: nowrap;
        margin-right: 8px;
      }
      button:disabled {
        background: #ccc;
        border-color: #ccc;
        cursor: not-allowed;
      }
      #generateBtn,
      #copyBtn {
        background: #fff;
        color: #333;
        border-color: #ccc;
      }
      #status {
        font-size: 12px;
        color: #666;
        font-style: italic;
        margin-top: 8px;
      }
      #stateBadge {
        font-size: 11px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 10px;
        margin-left: 8px;
      }
      #stateBadge.draft {
        background: #fff6e5;
        color: #8a5300;
      }
      #stateBadge.approved {
        background: #e6f4ea;
        color: #1a7a1a;
      }
      #contentTypeLabel {
        display: block;
        font-size: 12px;
        color: #555;
        margin-bottom: 4px;
      }
      #contentTypeSelect {
        font: inherit;
        font-size: 14px;
        padding: 6px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      #modifierLabel {
        display: block;
        font-size: 12px;
        color: #555;
        margin-bottom: 4px;
      }
      #modifierInput {
        width: 100%;
        font: inherit;
        font-size: 14px;
        padding: 8px 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Content <span id="stateBadge"></span></h1>
    <div id="dayInfo">Loading…</div>

    <label id="contentTypeLabel" for="contentTypeSelect">Content type</label>
    <select id="contentTypeSelect">
      <option value="">Auto (today's default)</option>
      <option value="short-form">Short-form</option>
      <option value="long-form">Long-form</option>
      <option value="engagement">Engagement</option>
    </select>

    <div id="mediaNote"></div>
    <div id="noPlan">No content plan for this day — pick a content type above to override, or come back on a planned day.</div>

    <div id="editor" style="display: none;">
      <label id="modifierLabel" for="modifierInput">Theme / modifier (optional) — e.g. "Labor Day"</label>
      <input type="text" id="modifierInput" placeholder="Leave blank for no particular theme" />
      <textarea id="draftText" placeholder="Click Generate to draft today's post…"></textarea>
      <div id="charCount"></div>
      <p>
        <button id="generateBtn">Generate</button>
        <button id="copyBtn">Copy</button>
        <button id="approveBtn">Approve</button>
      </p>
      <div id="status"></div>
    </div>

    <script type="module" src="content.js"></script>
  </body>
</html>
